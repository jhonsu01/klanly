<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Klanly Admin</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0f0f13; color: #e8e8f0; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
    .center { height: 100%; display: grid; place-items: center; text-align: center; }
    .logo { width: 48px; height: 48px; border-radius: 12px; background: linear-gradient(135deg, #5b3df5, #8b5cf6); display: inline-grid; place-items: center; font-weight: 800; color: #fff; font-size: 24px; margin-bottom: 12px; }
    a { color: #8b5cf6; }
  </style>
  <script>
    // El panel de administración vive en la web (siempre actualizado).
    window.location.replace("https://klanly.vercel.app/admin");
  </script>
</head>
<body>
  <div class="center">
    <div>
      <div class="logo">K</div>
      <div>Abriendo el panel de administración…</div>
      <p><a href="https://klanly.vercel.app/admin">Klanly Admin</a></p>
    </div>
  </div>
</body>
</html>
